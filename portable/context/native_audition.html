<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Native voice audition</title>
<style>
body{font:17px/1.6 system-ui;background:#111820;color:#e6edf3;max-width:760px;margin:7vh auto;padding:24px}
h1{font-size:30px;line-height:1.2}p{color:#aebdca}button{font:inherit;padding:10px 22px;border:0;border-radius:8px;margin-right:12px;background:#a9e6cf;color:#10291e;cursor:pointer}button:disabled{opacity:.4;cursor:default}
#status{display:block;margin:24px 0;color:#a9e6cf}#text{white-space:pre-wrap;min-height:100px;border:1px solid #334656;padding:18px;border-radius:10px}small{color:#aebdca}
</style>
<h1>Native voice audition</h1>
<p>Experimental Context Spanning / PersonaPlex 7B candidate</p>
<p>Use headphones. Speak naturally, pause, or interrupt. The model generates its own words and speech.</p>
<p id="consent" hidden><label><input id="allow" type="checkbox"> Allow OpenAI to reason over my recognized words in this session.</label></p>
<button id="start" disabled>Start microphone</button><button id="stop" disabled>Stop</button>
<span id="status">Ready to connect</span><div id="text" aria-live="polite"></div>
<p><small id="disclosure">Reading session settings…</small></p>
<script>
let ws,ctx,stream,mic,player,external=false,configured=false;const $=id=>document.getElementById(id);
function startAllowed(){return configured&&(!external||$('allow').checked)}
$('allow').onchange=()=>{$('start').disabled=!startAllowed()};
fetch('/session').then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{configured=true;external=v.external_backend_enabled;$('consent').hidden=!external;$('start').disabled=!startAllowed();$('disclosure').textContent=external?'Experimental 60-second session. The model chooses when to ask OpenAI for help. Temporary recognition audio is deleted after each request; this app saves no conversation history. The candidate has not passed its full behavior tests.':'Experimental voice test. External reasoning is disconnected. This app saves no conversation history. The candidate has not passed its full behavior tests.'}).catch(()=>{$('status').textContent='Cannot read session settings. Refresh to try again.'});
async function stop(){const oldStream=stream,oldSocket=ws,oldContext=ctx;ws=ctx=stream=mic=player=null;if(oldStream)oldStream.getTracks().forEach(t=>t.stop());if(oldSocket)oldSocket.close();if(oldContext&&oldContext.state!=='closed')await oldContext.close();$('start').disabled=!startAllowed();$('stop').disabled=true;}
async function audio(format,socket){const ac=new AudioContext({sampleRate:format.sample_rate});let recording,installed=false;
 try{await ac.resume();if(ac.sampleRate!==format.sample_rate)throw Error('Unsupported audio sample rate');
 await ac.audioWorklet.addModule('/static/mic.js');await ac.audioWorklet.addModule('/static/player.js');if(ws!==socket)return;
 recording=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:false}});if(ws!==socket)return;
 const output=new AudioWorkletNode(ac,'agent-player',{processorOptions:{frameSize:format.frame_size},outputChannelCount:[1]});output.connect(ac.destination);
 const input=new AudioWorkletNode(ac,'mic-frames',{processorOptions:{frameSize:format.frame_size}});const mute=ac.createGain();mute.gain.value=0;input.connect(mute).connect(ac.destination);ac.createMediaStreamSource(recording).connect(input);
 ctx=ac;stream=recording;player=output;mic=input;installed=true;input.port.onmessage=e=>{if(ws===socket&&socket.readyState===WebSocket.OPEN)socket.send(e.data.buffer)};$('status').textContent='Listening · speak naturally';
 }finally{if(!installed){if(recording)recording.getTracks().forEach(t=>t.stop());if(ac.state!=='closed')await ac.close();}}}
$('start').onclick=async()=>{try{if(!startAllowed())return;$('start').disabled=true;$('stop').disabled=false;$('text').textContent='';$('status').textContent='Connecting to native model…';
 const socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws=socket;socket.binaryType='arraybuffer';
 socket.onmessage=async e=>{if(ws!==socket)return;try{if(typeof e.data!=='string'){if(player)player.port.postMessage(e.data,[e.data]);return}const m=JSON.parse(e.data);
  if(m.type==='ready')await audio(m,socket);if(m.type==='text')$('text').textContent+=m.delta;if(m.type==='ret')$('status').textContent=external?'Listening · thinking in the background':'The model requested external reasoning · disconnected';if(m.type==='backend_result')$('status').textContent=m.route==='error'?'Listening · background request failed':'Listening · background result received';if(m.type==='backend_retired')$('status').textContent='Listening · outdated result discarded';if(m.type==='busy')throw Error('The previous session is ending. Try again shortly.');if(m.type==='error')throw Error(m.message);
 }catch(err){if(ws===socket){$('status').textContent=err.message;await stop();}}};
 socket.onerror=()=>{if(ws===socket)$('status').textContent='Connection failed'};socket.onclose=async()=>{if(ws!==socket)return;await stop();$('status').textContent='Session ended · reconnect for a fresh conversation';};
 }catch(err){$('status').textContent=err.message;await stop();}};
$('stop').onclick=async()=>{await stop();$('status').textContent='Stopped';};window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(ws)ws.close()});
</script></html>
